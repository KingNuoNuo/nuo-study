name: Android CI

# 每次 push 自动出两个 APK（孩子端 + 家长端），打成 artifact 供下载；
# 打 tag（v1.0.0 这种）时额外建一个 Release 并把 APK 挂上去。
#
# ⚠️ CI 上**没有** android/local.properties（它在 .gitignore 里），
#    所以 ServerDefaults 的内置地址/令牌是空串 —— 这正是我们想要的：
#    公开构建出来的 APK 不含任何人的服务器地址，装完由家长在「设置」里填。
#    想给自己家免填，就在本地 local.properties 里配（见 README「首次配置」）。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑最便宜的一层：Python 语法 + 网页 JS 语法。
  # 这两步 10 秒内出结果，能在花 8 分钟编 APK 之前就挡住低级错误。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python 语法
        run: python -m py_compile server/*.py tools/*.py

      - name: 网页 JS 语法
        run: node --check web/english/app.js

      - name: 课程数据自检
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('web/english/curriculum.json', encoding='utf-8'))
          units = d.get('units') or []
          words = sum(len(u.get('words') or []) for u in units)
          quiz = sum(len(u.get('quiz') or []) for u in units)
          print(f'单元 {len(units)} / 单词 {words} / 练习题 {quiz}')
          if len(units) < 8:
              sys.exit('课程单元少于 8 个，curriculum.json 可能没提交全')
          PY

  build:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 带小版本号（见 android/buildSrc/.../Config.kt），
      # 平台包名是 platforms;android-37.2。预装镜像里通常没有，得自己拉。
      # license 不先接受的话，AGP 的自动下载会静默失败，报「平台未安装」。
      - name: 接受 SDK license 并装 platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.2" > /dev/null 2>&1 || true

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app-student:assemblePerf :app-parent:assemblePerf --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            android/app-student/build/outputs/apk/perf/*.apk
            android/app-parent/build/outputs/apk/perf/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
