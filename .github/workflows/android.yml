name: Android CI

# 每次 push 自动出两个 APK（孩子端 + 家长端），打成 artifact 供下载；
# 打 tag（v1.0.0 这种）时额外建一个 Release 并把 APK 挂上去。
#
# ⚠️ CI 上**没有** android/local.properties（它在 .gitignore 里），
#    所以 ServerDefaults 的内置地址/令牌是空串 —— 这正是我们想要的：
#    公开构建出来的 APK 不含任何人的服务器地址，装完由家长在「设置」里填。
#    想给自己家免填，就在本地 local.properties 里配（见 README「首次配置」）。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑最便宜的一层：Python 语法 + 网页 JS 语法。
  # 这两步 10 秒内出结果，能在花 8 分钟编 APK 之前就挡住低级错误。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python 语法
        run: python -m py_compile server/*.py tools/*.py

      - name: 网页 JS 语法
        run: node --check web/english/app.js

      - name: 课程数据自检
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('web/english/curriculum.json', encoding='utf-8'))
          units = d.get('units') or []
          words = sum(len(u.get('words') or []) for u in units)
          quiz = sum(len(u.get('quiz') or []) for u in units)
          print(f'单元 {len(units)} / 单词 {words} / 练习题 {quiz}')
          if len(units) < 8:
              sys.exit('课程单元少于 8 个，curriculum.json 可能没提交全')
          PY

  build:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ 不要用 android-actions/setup-android@v3：它内部会跑 `sdkmanager "tools"`，
      #    而 runner 上的 cmdline-tools 16.0 已经移除了 `tools` 这个包 →
      #    报 `Failed to find package 'tools'` 并直接退出（2026-10-23 踩到）。
      #    ubuntu-latest 本来就预装了 Android SDK，`sdkmanager` 也在 PATH 里，直接用。
      - name: 接受 SDK license 并装 platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # compileSdk 37 带小版本号（见 android/buildSrc/.../Config.kt），包名是 android-37.2。
          # 装不上也不失败：AGP 的 sdkDownload 会自己拉（license 上面已经接受了）。
          sdkmanager "platforms;android-37.2" || echo "::warning::android-37.2 预装失败，交给 AGP 自动下载"
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app-student:assemblePerf :app-parent:assemblePerf --no-daemon --stacktrace

      - name: 收拢 APK
        # upload-artifact@v4 会剥掉路径的公共祖先（android/），artifact 内部变成
        # app-student/build/outputs/... 的深层结构 —— release 里 `apk/*.apk` 就匹配
        # 不到（softprops 还不报错，假装成功）。先拷到固定浅目录，结构完全可控。
        run: |
          mkdir -p apks
          cp android/app-student/build/outputs/apk/perf/*.apk apks/
          cp android/app-parent/build/outputs/apk/perf/*.apk apks/
          ls -la apks/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apks/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
          # 2026-10-23 踩坑：pattern 匹配不到文件时它**不报错**，静默建一个
          # 空资产 Release 假装成功。加上这行，匹配不到就直接 fail。
          fail_on_unmatched_files: true
