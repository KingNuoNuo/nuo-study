# =============================================================================
# Gradle 构建参数
# ⚠️ 本机是 Windows，路径含中文时 file.encoding 必须显式声明，
#    否则 Kotlin 源码里的中文字符串（大量作业题干）会编成乱码。
# =============================================================================

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存能显著加速增量构建，但首次接入新插件时容易报
# "configuration cache problems"。若构建报这类错，先关掉它定位，别硬开。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true

# 每个模块只生成自己的 R 类（AGP 8+ 默认行为，显式写出来是为了避免老文档误导）
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP 增量处理。Room / Hilt 的代码生成都走它。
ksp.incremental=true
