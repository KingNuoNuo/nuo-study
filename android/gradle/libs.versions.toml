# =============================================================================
# Gradle Version Catalog
# 基准版本组合（对齐于 2026-10，均已核对为当时的稳定版）：
#     Gradle 9.8.1 · AGP 9.4.1 · Kotlin 2.3.21 · KSP 2.3.12 · Compose BOM 2026.09.00
#
# ⚠️ 升级规则（踩过就知道）：
#   1. KSP 的次版本号**跟随 Kotlin**（Kotlin 2.3.x → KSP 2.3.x）。
#      Kotlin 2.4.20 虽然已发布，但 KSP 尚未跟进，强行搭配会让 Room / Hilt 的
#      注解处理直接失败 → 所以这里停在 Kotlin 2.3.21。
#      升 Kotlin 前先查：https://repo1.maven.org/maven2/com/google/devtools/ksp/
#   2. Compose 编译器插件的版本 = Kotlin 版本（Kotlin 2.0 起内置，独立发布已是历史）。
#   3. Compose 的 UI/material 库版本由 BOM 统一管理，**不要单独写版本号**。
# =============================================================================

[versions]
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.12"
composeBom = "2026.09.00"

coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"

hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"

retrofit = "3.0.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"

# 小智 AI 语音：opus 编解码的纯 Java 实现（Concentus）。
# 不用 MediaCodec 的原因：opus 帧长必须精确 60ms 对齐小智协议，MediaCodec 帧长不可控。
concentus = "1.0.1"

room = "2.8.5"
work = "2.12.0"
datastore = "1.2.1"

junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
# ---------------- AndroidX 基础
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# ---------------- Compose（版本由 BOM 决定）
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# 小学端要大量用图标（语文/数学/英语/作业各一套），extended 包体积可接受
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# ---------------- 依赖注入
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# ---------------- 网络
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# 语音助手（小智 AI 接入）：Concentus —— opus 编解码纯 Java 移植
concentus = { module = "io.github.jaredmdobson:concentus", version.ref = "concentus" }

# ---------------- 本地存储
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ---------------- 后台任务（离线补传的载体）
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltNavigationCompose" }

# ---------------- 测试
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# ---------------- 仅供 buildSrc 的 convention plugin 使用（构建脚本 classpath）
# 这些坐标不出现在任何模块的 dependencies 里，只给 buildSrc 用。
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
